# To test audio API:
# curl -v -X POST -F "file=@./api/birdnet/examples/barnowl.mp3"   "http://localhost:8020/predict?top_k=5&min_conf=0.0" | jq
# curl -v -X POST -F "file=@./api/birdnet/examples/littleowl.mp3"   "http://localhost:8020/predict?top_k=5&min_conf=0.0" | jq

# To test image API:
# curl -v -X POST -F "file=@./api/inat21/examples/barnowl-1.jpg" "http://localhost:8021/classify?top_k=5&min_conf=0.0" | jq
# curl -v -X POST -F "file=@./api/inat21/examples/barnowl-2.jpg" "http://localhost:8021/classify?top_k=5&min_conf=0.0" | jq
# curl -v -X POST -F "file=@./api/inat21/examples/barnowl-3.jpg" "http://localhost:8021/classify?top_k=5&min_conf=0.0" | jq
# curl -v -X POST -F "file=@./api/inat21/examples/littleowl-1.jpg" "http://localhost:8021/classify?top_k=5&min_conf=0.0" | jq
# curl -s "http://localhost:8021/healthz" | jq  # health check

services:
  bird-audio-api:
    build: ./api/birdnet
    image: birdnet-fastapi:latest
    container_name: bird-audio-api
    ports:
      - "8020:8020"
    environment:
      # tweak defaults as you like
      - TOP_K=5
      - MIN_CONF=0.0
      # In production, set a specific origin or leave blank if you proxy via Nuxt
      - CORS_ALLOW_ORIGINS=*
    restart: unless-stopped

  bird-img-api:
    build: ./api/inat21
    image: birdimg-fastapi-yolo:latest
    container_name: bird-img-api
    ports:
      - "8021:8021"
    environment:
      # Classifier
      - MODEL_ID=timm/convnext_large_mlp.laion2b_ft_augreg_inat21
      - TOP_K=5
      - MIN_CONF=0.0
      - TORCH_NUM_THREADS=4
      # Detector
      - DETECTOR_WEIGHTS=/home/appuser/models/yolov8s.pt # try yolov8n.pt for faster CPU inference
      - DETECTOR_CONF=0.25
      - DETECTOR_IOU=0.5
      - DETECTOR_MARGIN=0.05
      - CLASSIFY_ALL_DETS=false
      # Ultralytics config dir (writable, persistent)
      - YOLO_CONFIG_DIR=/home/appuser/.config/Ultralytics
      # CORS (lock down behind Nuxt proxy in prod)
      - CORS_ALLOW_ORIGINS=*
    volumes:
      - ./cache/hf:/home/appuser/.cache/huggingface
      - ./cache/torch:/home/appuser/.cache/torch
      - ./cache/ultralytics:/home/appuser/.cache/ultralytics
      - ./cache/ultralytics-config:/home/appuser/.config/Ultralytics
    restart: unless-stopped
