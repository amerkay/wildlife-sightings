name: Deploy (Supabase + GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  supabase:
    name: Deploy Supabase Edge Function
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set production secrets in Supabase (idempotent)
        run: |
          supabase secrets set \
            TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            TURNSTILE_SECRET_KEY="$TURNSTILE_SECRET_KEY" \
            --project-ref "$PROJECT_ID"
      - name: Deploy turnstile-verify
        run: |
          supabase functions deploy turnstile-verify --project-ref "$PROJECT_ID"

  pages:
    name: Build static site
    needs: supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      MAPBOX_ACCESS_TOKEN: ${{ vars.MAPBOX_ACCESS_TOKEN }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      NUXT_APP_BASE_URL: "/${{ github.event.repository.name }}/"
      NUXT_APP_CDN_URL: ${{ vars.NUXT_APP_CDN_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      IDENTIFY_API_URL: ${{ vars.IDENTIFY_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm (use version from packageManager)
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        run: pnpm generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    name: Deploy to GitHub Pages
    needs: pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
